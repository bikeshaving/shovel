name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run on the merge queue's temporary branches so queued PRs get their
  # required checks — without this the queue stalls with no status.
  merge_group:

# Least-privilege token: this workflow only builds/lints/typechecks/tests and
# never writes to the repo. Lock it explicitly so it stays read-only regardless
# of the repo's default-token setting.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun link && bun install

      - name: Build
        run: bun run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            packages/*/dist
            dist
          retention-days: 1

  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun link && bun install

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: .

      - name: Lint
        run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun link && bun install

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: .

      - name: Typecheck
        run: tsc --noEmit

  test:
    runs-on: ubuntu-latest
    needs: build

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # Increase inotify watch limit for esbuild watch mode tests
      # Default is 8192 which gets exhausted when running multiple file watcher tests
      - name: Increase inotify watch limit
        run: |
          echo fs.inotify.max_user_watches=524288 | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun link && bun install

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: .

      - name: Test
        # bun run test (NOT bare `bun test`): bunfig excludes the
        # Miniflare-based cloudflare-*.test.* files from the default walk
        # (concurrent workerd spawns flake); the root test script runs them
        # sequentially after the main suite.
        run: bun run test
